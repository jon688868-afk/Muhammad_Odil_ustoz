name: Diagnose Server 2

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check data.js and app.js
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "=== data.js check ==="
            ls -la /var/www/ibxi/assets/js/data.js 2>/dev/null || echo "data.js NOT FOUND!"
            echo ""
            echo "=== data.js first 5 lines ==="
            head -5 /var/www/ibxi/assets/js/data.js 2>/dev/null || echo "CANNOT READ"
            echo ""
            echo "=== app.js check ==="
            ls -la /var/www/ibxi/assets/js/app.js 2>/dev/null || echo "app.js NOT FOUND!"
            echo ""
            echo "=== All JS files ==="
            ls -la /var/www/ibxi/assets/js/ 2>/dev/null || echo "js dir NOT FOUND"
            echo ""
            echo "=== Nginx access log (last 20) ==="
            tail -20 /var/log/nginx/access.log 2>/dev/null || true
            echo ""
            echo "=== curl index.html from server ==="
            curl -s http://127.0.0.1:8765/ | head -10
            echo ""
            echo "=== curl data.js from server ==="
            curl -sI http://127.0.0.1:8765/assets/js/data.js 2>&1 | head -10
            echo ""
            echo "=== Server error log ==="
            journalctl -u ibxi.service --no-pager -n 20 --since "10 min ago" 2>&1 || true
