<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>IBXI Admin Panel</title>
  <link rel="stylesheet" href="assets/css/style.css?v=4.1" />
  <link rel="stylesheet" href="assets/css/admin.css?v=4.1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2301a5a8'/><text y='72' x='50' text-anchor='middle' font-size='36' font-family='serif' fill='%23e4b73a'>ب</text></svg>" />
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="admin-login" id="login-screen">
  <div class="admin-login-card">
    <img src="assets/img/logo-gold.png" alt="Logo" style="width:48px;height:48px;object-fit:contain;margin-bottom:12px" />
    <h1>IBXI Admin Panel</h1>
    <p class="login-sub">Boshqaruv paneliga kirish</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Admin parolini kiriting" autocomplete="current-password" autofocus />
      <button type="submit" class="admin-login-btn" id="login-btn">Kirish</button>
    </form>
    <div class="login-error" id="login-error" role="alert"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-app" style="display:none">
  <!-- SIDEBAR -->
  <aside id="admin-sidebar"></aside>

  <!-- TOPBAR -->
  <header id="admin-topbar"></header>

  <!-- MAIN CONTENT -->
  <main id="admin-main">
    <div id="admin-content"></div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="admin-modal" role="dialog" aria-modal="true">
  <div class="modal-box" style="max-width:680px;max-height:90vh;overflow-y:auto">
    <button class="modal-close" data-action="admin-modal-close" data-modal="admin-modal" aria-label="Yopish">&#10005;</button>
    <div id="admin-modal-content"></div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="modal-backdrop" id="confirm-modal" role="dialog" aria-modal="true">
  <div class="modal-box" style="max-width:400px">
    <div id="confirm-content"></div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container" role="alert" aria-live="polite"></div>

<!-- SCRIPTS -->
<script src="assets/js/admin.js?v=4.1"></script>

</body>
</html>
